[project]
name = "mechinterp"
version = "0.1.0"
description = "Research tooling for mech-interp-style LLM modification experiments."
readme = "README.md"
authors = [
    { name = "Andrew C Emil", email = "andrewcemil@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.0.0",
    "scikit-learn>=1.0.0",
    "torch>=2.0.0",
    "transformers>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "mypy>=2.0.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
